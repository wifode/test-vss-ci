name: VSS FVR (unattended)

# Runs the FVR pipeline against the VSS Blueprint, one job per developer
# profile x deployment mode combination, fully unattended -- see
# .github/vss-fvr-autorun/CI_OVERRIDE.md and run-vss-fvr.sh for how the pipeline's
# normal human-in-the-loop gates are auto-resolved for CI.
#
# The runner itself does not need a GPU: every product-affecting command
# runs over SSH against SERVER_HOST (a fixed, pre-provisioned GPU box).

on:
  # Deliberately workflow_dispatch-only, no `push:` trigger. A push kicking
  # off a real (multi-$, ~1h) GPU run for any unrelated commit -- and always
  # defaulting to `lvs` regardless of what actually changed -- was a real
  # hazard hit in practice (a docs/config-only push queued a redundant lvs
  # run behind an intentionally-dispatched alerts run). Explicit dispatch
  # means every run is a deliberate choice with a chosen profile.
  workflow_dispatch:
    inputs:
      profiles:
        description: "Comma-separated profiles to run (default: all matched below)"
        required: false
        default: "lvs"
      docs_urls:
        description: "Comma-separated documentation URLs to review (blank = the driver's built-in defaults). Pin a version rather than /latest/ so every job in this run reads the same source material."
        required: false
        default: ""
      model:
        description: "ANTHROPIC_MODEL override (route-specific ID, not a bare model name -- see AI_ASSETS/DECISIONS.md I9). Blank uses the default below."
        required: false
        default: ""

  # Add schedule only after workflow_dispatch-triggered runs have been
  # verified clean and the GPU-box lifecycle policy is decided.
  # schedule:
  #   - cron: "0 6 * * 1" # weekly, Monday 06:00 UTC

concurrency:
  group: vss-fvr-${{ github.repository }}
  cancel-in-progress: false

jobs:
  fvr:
    # No OS label: the current runner is macOS (your machine, for this first
    # test); a future production runner may be Linux. run-vss-fvr.sh already
    # supports both (caffeinate/timeout-vs-gtimeout branches).
    runs-on: [self-hosted]
    timeout-minutes: 240 # hard backstop above run-vss-fvr.sh's own --timeout-hours
    strategy:
      fail-fast: false
      matrix:
        # Full 4 (profile) x 4 (llm_mode x vlm_mode) cross-product,
        # deliberately NOT pre-filtered by today's specific GPU box. Which
        # combos actually fit is a function of whatever hardware is attached
        # when a run happens -- checked live, per-run, against the real
        # detected inventory (already threaded into the agent's plan-creation
        # prompt), not assumed here. A cell whose requested combo doesn't fit
        # the attached hardware is expected to recognize that itself and stop
        # cleanly (CI-STATUS: skipped-hardware-infeasible, near-zero cost --
        # see CI_OVERRIDE.md's Step 0 addition) rather than being silently
        # excluded from the matrix or silently substituted with a different
        # config than the one it's labeled with.
        include:
          - profile: lvs
            llm_mode: local
            vlm_mode: local
            llm_provider: ""
            vlm_provider: ""
          - profile: lvs
            llm_mode: local
            vlm_mode: remote
            llm_provider: ""
            vlm_provider: nvidia
          - profile: lvs
            llm_mode: remote
            vlm_mode: local
            llm_provider: nvidia
            vlm_provider: ""
          - profile: lvs
            llm_mode: remote
            vlm_mode: remote
            llm_provider: nvidia
            vlm_provider: nvidia
          - profile: base
            llm_mode: local
            vlm_mode: local
            llm_provider: ""
            vlm_provider: ""
          - profile: base
            llm_mode: local
            vlm_mode: remote
            llm_provider: ""
            vlm_provider: nvidia
          - profile: base
            llm_mode: remote
            vlm_mode: local
            llm_provider: nvidia
            vlm_provider: ""
          - profile: base
            llm_mode: remote
            vlm_mode: remote
            llm_provider: nvidia
            vlm_provider: nvidia
          - profile: search
            llm_mode: local
            vlm_mode: local
            llm_provider: ""
            vlm_provider: ""
          - profile: search
            llm_mode: local
            vlm_mode: remote
            llm_provider: ""
            vlm_provider: nvidia
          - profile: search
            llm_mode: remote
            vlm_mode: local
            llm_provider: nvidia
            vlm_provider: ""
          - profile: search
            llm_mode: remote
            vlm_mode: remote
            llm_provider: nvidia
            vlm_provider: nvidia
          - profile: alerts
            llm_mode: local
            vlm_mode: local
            llm_provider: ""
            vlm_provider: ""
          - profile: alerts
            llm_mode: local
            vlm_mode: remote
            llm_provider: ""
            vlm_provider: nvidia
          - profile: alerts
            llm_mode: remote
            vlm_mode: local
            llm_provider: nvidia
            vlm_provider: ""
          - profile: alerts
            llm_mode: remote
            vlm_mode: remote
            llm_provider: nvidia
            vlm_provider: nvidia

    env:
      SERVER_HOST: ${{ secrets.VSS_SERVER_HOST }}
      SERVER_USER: ${{ secrets.VSS_SERVER_USER }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
      # Model ID is not sensitive (unlike the base URL, which is an internal
      # endpoint) -- versioned as a default here, overridable per-run via the
      # workflow_dispatch `model` input, no secrets-UI edit needed either way.
      # Default is the confirmed-working ID for this account's route (see
      # AI_ASSETS/DECISIONS.md I9) -- update this literal if that changes.
      ANTHROPIC_MODEL: ${{ github.event.inputs.model || 'aws/anthropic/claude-opus-4-5' }}
      NGC_API_KEY: ${{ secrets.NGC_API_KEY }}
      NGC_CLI_API_KEY: ${{ secrets.NGC_API_KEY }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      LLM_ENDPOINT_URL: ${{ secrets.VSS_LLM_ENDPOINT_URL }}
      NV_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      # Comma-separated; empty falls through to run-vss-fvr.sh's built-in
      # defaults. Set once here so every matrix job reviews the same pages.
      FVR_DOCS_URLS: ${{ inputs.docs_urls }}
      GDOC_ENABLED: "false"
      LITMUS_ENABLED: "false"

    steps:
      - name: Skip if not requested
        id: gate
        shell: bash
        run: |
          requested="${{ github.event.inputs.profiles || 'lvs' }}"
          if [[ ",${requested}," == *",${{ matrix.profile }},"* || "$requested" == "all" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      # This repo's own CI driver (scripts/ci scripts, CI_OVERRIDE.md) --
      # separate from the fvr-skill checkout below. run-vss-fvr.sh and
      # CI_OVERRIDE.md are NOT expected to exist in fvr-skill; they live only
      # here and are invoked from this checkout, never copied.
      - name: Checkout CI driver (this repo)
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          path: ci-driver

      # actions/checkout only talks to GitHub; fvr-skill lives on NVIDIA's
      # internal GitLab, so it's cloned directly instead. Nothing here is
      # committed to this repo -- the clone lives only in the ephemeral job
      # workspace, and supplies AGENTS.md / .claude/agents / scripts/fvr-log.py
      # / knowledge / schemas / review-configs -- the files this repo's own
      # driver does NOT ship and does not expect to find in this repo.
      #
      # TEMPORARY (first end-to-end test only): SSH clone was tried first but
      # blocks forever on an interactive passphrase prompt in a headless
      # runner -- fatal for an unattended pipeline. Switched to HTTPS with a
      # GitLab personal access token (self-service, read_repository scope,
      # created under the user's own account -- no maintainer needed, unlike
      # a project deploy token). Still personal-credential-based; swap for a
      # project-scoped deploy token once maintainer access is escalated, so
      # CI doesn't depend on one person's token indefinitely.
      - name: Checkout fvr-skill
        if: steps.gate.outputs.run == 'true'
        shell: bash
        env:
          GITLAB_FVR_SKILL_TOKEN: ${{ secrets.GITLAB_FVR_SKILL_TOKEN }}
        run: |
          # Self-hosted runners reuse their _work dir across runs (unlike
          # GitHub-hosted ephemeral VMs), so a prior run's checkout can still
          # be here and `git clone` refuses to clone into a non-empty dir.
          # This checkout is purely ephemeral input, safe to always wipe.
          rm -rf fvr-skill
          git clone --depth 1 \
            "https://oauth2:${GITLAB_FVR_SKILL_TOKEN}@gitlab-master.nvidia.com/vdragents-external/fvr-skill.git" \
            fvr-skill

      # run-vss-fvr.sh's own log-dir root is redirected via FVR_LOGS_ROOT
      # (set on the "Run FVR" step below) -- that's our file, no symlink
      # needed there. AGENTS.md Step 9 (upstream, not ours to edit -- D27)
      # is different: it has the agent copy its report to
      # reports/{product}-{date}.md relative to its cwd, a path we have no
      # override for. That path resolves inside the fvr-skill/ clone above,
      # which gets `rm -rf` fresh every run -- without this symlink, every
      # run's report would be deleted by the next run's checkout, and only
      # whatever made it into a GitHub artifact would survive at all.
      # logs/ ALSO needs this symlink, not just FVR_LOGS_ROOT (set on the
      # "Run FVR" step): FVR_LOGS_ROOT only redirects where run-vss-fvr.sh
      # ITSELF writes (00-config.yaml, 01-doc-review.md, etc. -- confirmed
      # correct). But the agent, per AGENTS.md's own upstream (unmodifiable)
      # conventions, writes some artifacts -- confirmed: CI-BLOCKED.md, the
      # fail-closed clause's artifact -- via a bare relative "logs/..." path,
      # which resolves against its cwd (fvr-skill/), not our env var. A real
      # disk-space blocker got silently lost this way (I27 continuation, see
      # AI_ASSETS/DECISIONS.md): the agent wrote a fully correct diagnosis to
      # fvr-skill/logs/.../CI-BLOCKED.md, which nothing ever looked at, so
      # the run was misclassified incomplete-no-report instead of blocked.
      # The symlink makes both path conventions land in the same place,
      # regardless of which one any given artifact uses.
      - name: Persist logs/reports across runs
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          mkdir -p fvr-history/logs fvr-history/reports
          rm -rf fvr-skill/logs fvr-skill/reports
          ln -s "${{ github.workspace }}/fvr-history/logs" fvr-skill/logs
          ln -s "${{ github.workspace }}/fvr-history/reports" fvr-skill/reports

      # Local reference checkout for THIS RUNNER's own tooling only (reading
      # profile .env templates for the required-var check, and skill
      # reference docs when no pre-baked plan matches) -- NOT installed onto
      # the SSH target. The agent gets VSS onto the actual GPU box itself,
      # live, by following the product's published docs over SSH as part of
      # Doc-Faithful Testing. See AI_ASSETS/DECISIONS.md.
      - name: Checkout VSS repo (local reference for preflight tooling only)
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          repository: NVIDIA-AI-Blueprints/video-search-and-summarization
          path: video-search-and-summarization
          lfs: false # plain-text .env/docs only; no need to pull LFS sample data for tooling reads

      # actions/setup-python is a known-broken fit for self-hosted macOS
      # runners: its install script hardcodes /Users/runner/hostedtoolcache
      # regardless of RUNNER_TOOL_CACHE (confirmed via actions/setup-python
      # issues #974/#792 -- an upstream account-name assumption, not
      # something fixable via env vars). Use whatever Python 3.10+ is
      # already on this runner instead (vss-preflight.py needs 3.10+ for its
      # PEP 604 union type hints; system python3 here is 3.9.6, too old --
      # `brew install python@3.11` was run once, out-of-band, on this box).
      - name: Ensure Python 3.10+ on PATH
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          for candidate_dir in \
            /opt/homebrew/opt/python@3.12/libexec/bin \
            /opt/homebrew/opt/python@3.11/libexec/bin \
            /opt/homebrew/opt/python@3.10/libexec/bin \
            /usr/local/opt/python@3.12/libexec/bin \
            /usr/local/opt/python@3.11/libexec/bin \
            /usr/local/opt/python@3.10/libexec/bin; do
            if [ -x "$candidate_dir/python3" ]; then
              echo "$candidate_dir" >> "$GITHUB_PATH"
              echo "Using $("$candidate_dir/python3" --version) from $candidate_dir"
              exit 0
            fi
          done
          if command -v python3 >/dev/null 2>&1 && \
             python3 -c 'import sys; exit(0 if sys.version_info >= (3, 10) else 1)'; then
            echo "System python3 ($(python3 --version)) is already 3.10+."
            exit 0
          fi
          echo "::error::No Python 3.10+ found on this runner. Install one (e.g. 'brew install python@3.11' on macOS) and ensure it's on PATH." >&2
          exit 1

      - name: Write SSH key
        if: steps.gate.outputs.run == 'true'
        shell: bash
        env:
          VSS_SERVER_SSH_KEY: ${{ secrets.VSS_SERVER_SSH_KEY }}
        run: |
          install -m 600 /dev/null "$RUNNER_TEMP/vss_ssh_key"
          printf '%s' "$VSS_SERVER_SSH_KEY" > "$RUNNER_TEMP/vss_ssh_key"
          echo "SSH_KEY_PATH=$RUNNER_TEMP/vss_ssh_key" >> "$GITHUB_ENV"

      - name: Install claude CLI
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          npm install -g @anthropic-ai/claude-code
          claude --version

      - name: Install Playwright (for ui-tester)
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          npm install -g playwright
          npx playwright install --with-deps chromium

      # working-directory is the fvr-skill clone, not ci-driver: run-vss-fvr.sh
      # never `cd`s internally, so whatever directory it's launched from is
      # where `claude` looks for AGENTS.md / .claude/agents. CI_OVERRIDE.md is
      # still read from this repo's checkout regardless of cwd, since
      # run-vss-fvr.sh resolves it relative to its own script path
      # ($SCRIPT_DIR), not the working directory.
      - name: Run FVR for ${{ matrix.profile }}
        if: steps.gate.outputs.run == 'true'
        shell: bash
        working-directory: fvr-skill
        env:
          VSS_REPO_LOCAL_REFERENCE: ${{ github.workspace }}/video-search-and-summarization
          FVR_SKILL_REPO: ${{ github.workspace }}/fvr-skill
          # Root outside fvr-skill/, which gets rm -rf'd and re-cloned every
          # run -- keeps log history across runs instead of each run
          # deleting the previous one's.
          FVR_LOGS_ROOT: ${{ github.workspace }}/fvr-history/logs
        run: |
          "${{ github.workspace }}/ci-driver/.github/vss-fvr-autorun/run-vss-fvr.sh" "${{ matrix.profile }}" \
            --llm-mode "${{ matrix.llm_mode }}" \
            --vlm-mode "${{ matrix.vlm_mode }}" \
            --llm-provider "${{ matrix.llm_provider }}" \
            --vlm-provider "${{ matrix.vlm_provider }}" \
            --timeout-hours 3

      # Only curated, structured outputs go to GitHub -- never the raw
      # claude-stream.jsonl / ci-driver-transcript.log / claude-stderr.log /
      # 02-commands.jsonl. Those are full verbatim tool_use/tool_result
      # dumps (a `.env` read, a `docker compose config` dump, etc. could
      # appear in them raw), and this repo already had a real incident from
      # uploading exactly that shape of data: skills-eval.yml's artifact
      # step excludes its own raw per-trial trajectory dir for the same
      # reason ("PR #516 leaked NGC_CLI_API_KEY this way"). Excluded, not
      # redacted -- simpler and doesn't depend on correctly enumerating
      # every secret. The raw files still exist in full at
      # fvr-history/logs/vss-<profile>-*/ (FVR_LOGS_ROOT, set on the "Run
      # FVR" step) for local debugging; only what leaves the runner is
      # narrowed. reports/ still goes through the fvr-skill/reports symlink
      # (AGENTS.md writes there directly, no override available) but paths
      # here point at fvr-history/reports directly rather than through it --
      # unverified whether actions/upload-artifact's glob engine follows
      # symlinked directories, so this sidesteps the question either way.
      - name: Upload logs and reports
        if: steps.gate.outputs.run == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: vss-fvr-${{ matrix.profile }}-${{ github.run_id }}
          path: |
            fvr-history/logs/vss-${{ matrix.profile }}-*/*.md
            fvr-history/logs/vss-${{ matrix.profile }}-*/*.yaml
            fvr-history/logs/vss-${{ matrix.profile }}-*/CI-*
            fvr-history/logs/vss-${{ matrix.profile }}-*/screenshots/**
            fvr-history/reports/vss-${{ matrix.profile }}-*.md
          if-no-files-found: warn
          retention-days: 30

      - name: Job summary
        if: steps.gate.outputs.run == 'true' && always()
        shell: bash
        run: |
          status_file=$(ls fvr-history/logs/vss-${{ matrix.profile }}-*/CI-STATUS 2>/dev/null | tail -1 || true)
          status="unknown"
          [[ -n "$status_file" ]] && status="$(cat "$status_file")"
          echo "### VSS FVR — ${{ matrix.profile }}: \`$status\`" >> "$GITHUB_STEP_SUMMARY"
